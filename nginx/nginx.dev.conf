worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    # ── Logging ──────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Server ───────────────────────────────
    server {
        listen 80;
        server_name _;

        # 🛡️ BLINDAJE DE DNS: Fuerza a Nginx a resolver las IPs de Docker dinámicamente cada 5 segundos
        # Evita el error 502 Bad Gateway cuando los contenedores se reinician y cambian de IP
        resolver 127.0.0.11 valid=5s;

        # ── Health check ─────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-dev"}';
            add_header Content-Type application/json;
        }

        # ── API: Users ───────────────────────
        location /api/users/ {
            set $upstream_users http://ms-users:5001;
            proxy_pass $upstream_users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API: Books ───────────────────────
        location /api/books/ {
            set $upstream_books http://ms-books:5002;
            proxy_pass $upstream_books;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API: Chat (HTTP) ─────────────────
        location /api/chat/ {
            set $upstream_chat http://ms-chat:5003;
            proxy_pass $upstream_chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket: Socket.IO ─────────────
        location /socket.io/ {
            set $upstream_chat_ws http://ms-chat:5003;
            proxy_pass $upstream_chat_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ── Frontend (Vite dev server) ───────
        location / {
            set $upstream_frontend http://frontend:5173;
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite HMR WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
