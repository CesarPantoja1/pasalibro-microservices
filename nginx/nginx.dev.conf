worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    # ── Logging ──────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstreams ────────────────────────────
    upstream frontend {
        server frontend:5173;
    }

    upstream ms-users {
        server ms-users:5001;
    }

    upstream ms-books {
        server ms-books:5002;
    }

    upstream ms-chat {
        server ms-chat:5003;
    }

    # ── Server ───────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Health check ─────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-dev"}';
            add_header Content-Type application/json;
        }

        # ── API: Users ───────────────────────
        location /api/users/ {
            proxy_pass http://ms-users/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API: Books ───────────────────────
        location /api/books/ {
            proxy_pass http://ms-books/api/books/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API: Chat (HTTP) ─────────────────
        location /api/chat/ {
            proxy_pass http://ms-chat/api/chat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket: Socket.IO ─────────────
        location /socket.io/ {
            proxy_pass http://ms-chat/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ── Frontend (Vite dev server) ───────
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite HMR WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
