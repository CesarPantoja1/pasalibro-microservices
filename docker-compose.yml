# ============================================
# PasaLibro — Docker Compose (PRODUCCIÓN)
# ============================================
# Uso: docker compose up -d
# ============================================

services:
  # ── Cloudflare Tunnel ──────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pasalibro-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── Nginx API Gateway ─────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pasalibro-nginx
    ports:
      - "${HOST_PORT_NGINX:-9000}:80"
    depends_on:
      frontend:
        condition: service_started
      ms-users:
        condition: service_healthy
      ms-books:
        condition: service_healthy
      ms-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── Frontend (React + Vite — built) ────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pasalibro-frontend
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── MS-Users (Flask) ──────────────────────
  ms-users:
    build:
      context: ./services/ms-users
      dockerfile: Dockerfile
    container_name: pasalibro-ms-users
    environment:
      FLASK_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES}
      DATABASE_URL: "mssql+pyodbc://${DB_USER_USERS}:${DB_PASS_USERS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?driver=ODBC+Driver+18+for+SQL+Server"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/users/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── MS-Books (Flask) ──────────────────────
  ms-books:
    build:
      context: ./services/ms-books
      dockerfile: Dockerfile
    container_name: pasalibro-ms-books
    environment:
      FLASK_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: "mssql+pyodbc://${DB_USER_BOOKS}:${DB_PASS_BOOKS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?driver=ODBC+Driver+18+for+SQL+Server"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/books/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── MS-Chat (Flask + SocketIO) ─────────────
  ms-chat:
    build:
      context: ./services/ms-chat
      dockerfile: Dockerfile
    container_name: pasalibro-ms-chat
    environment:
      FLASK_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: "mssql+pyodbc://${DB_USER_CHAT}:${DB_PASS_CHAT}@${DB_HOST}:${DB_PORT}/${DB_NAME}?driver=ODBC+Driver+18+for+SQL+Server"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/api/chat/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── Prometheus ─────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: pasalibro-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${HOST_PORT_PROMETHEUS:-9001}:9090"
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── Grafana ────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: pasalibro-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${HOST_PORT_GRAFANA:-9002}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── Elasticsearch ──────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: pasalibro-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${HOST_PORT_ELASTIC:-9003}:9200"
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── Logstash ───────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: pasalibro-logstash
    volumes:
      - ./monitoring/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - pasalibro-net

  # ── Kibana ─────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: pasalibro-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${HOST_PORT_KIBANA:-9004}:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - pasalibro-net

networks:
  pasalibro-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
