name: CI Pipeline

on:
  push:
    branches: [develop, main, 'hotfix/**']
  pull_request:
    branches: [develop, main, 'hotfix/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Detect which parts of the codebase changed
  # ──────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ms-users: ${{ steps.filter.outputs.ms-users }}
      ms-books: ${{ steps.filter.outputs.ms-books }}
      ms-chat: ${{ steps.filter.outputs.ms-chat }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ms-users:
              - 'services/ms-users/**'
            ms-books:
              - 'services/ms-books/**'
            ms-chat:
              - 'services/ms-chat/**'
            frontend:
              - 'frontend/**'
            nginx:
              - 'nginx/**'
            infra:
              - 'docker-compose*.yml'

  # ──────────────────────────────────────────────
  # 2. Backend microservice jobs (parallel)
  # ──────────────────────────────────────────────
  lint-and-test-ms-users:
    name: "MS-Users · Lint & Test"
    needs: changes
    if: needs.changes.outputs.ms-users == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ms-users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ms-users/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest
      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=__pycache__,.venv --statistics
      - name: Tests (pytest)
        run: pytest -v --tb=short
        continue-on-error: true

  lint-and-test-ms-books:
    name: "MS-Books · Lint & Test"
    needs: changes
    if: needs.changes.outputs.ms-books == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ms-books
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ms-books/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest
      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=__pycache__,.venv --statistics
      - name: Tests (pytest)
        run: pytest -v --tb=short
        continue-on-error: true

  lint-and-test-ms-chat:
    name: "MS-Chat · Lint & Test"
    needs: changes
    if: needs.changes.outputs.ms-chat == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ms-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ms-chat/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest
      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=__pycache__,.venv --statistics
      - name: Tests (pytest)
        run: pytest -v --tb=short
        continue-on-error: true

  # ──────────────────────────────────────────────
  # 3. Frontend job
  # ──────────────────────────────────────────────
  lint-and-build-frontend:
    name: "Frontend · Lint & Build"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (eslint)
        run: bun run lint
        continue-on-error: true
      - name: Build check
        run: bun run build

  # ──────────────────────────────────────────────
  # 4. Infrastructure validation
  # ──────────────────────────────────────────────
  validate-infra:
    name: "Infra · Validate Docker & Nginx"
    needs: changes
    if: >-
      needs.changes.outputs.infra == 'true' ||
      needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy .env for validation
        run: cp .env.example .env
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q
      - name: Validate docker-compose.dev.yml
        run: docker compose -f docker-compose.dev.yml config -q
      - name: Validate Nginx config syntax
        run: |
          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host ms-users:127.0.0.1 \
            --add-host ms-books:127.0.0.1 \
            --add-host ms-chat:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:alpine nginx -t

  # ──────────────────────────────────────────────
  # 5. Build Docker images (only if everything passed)
  # ──────────────────────────────────────────────
  build-images:
    name: "Build Docker Images"
    needs:
      - lint-and-test-ms-users
      - lint-and-test-ms-books
      - lint-and-test-ms-chat
      - lint-and-build-frontend
      - validate-infra
    if: always() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy .env for build
        run: cp .env.example .env
      - name: Build all production images
        run: docker compose -f docker-compose.yml build
